<div class="{{ col|default:'col-md-6' }}">
  {% if field.field.widget.input_type == "checkbox" %}
    <div class="form-check form-switch mt-md-4 pt-md-2">
      <input class="form-check-input" type="checkbox" role="switch" name="{{ field.html_name }}" id="{{ field.id_for_label }}" {% if field.value %}checked{% endif %}>
      <label class="form-check-label fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}</label>
    </div>
  {% elif field.field.choices %}
    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
    <select name="{{ field.html_name }}" id="{{ field.id_for_label }}" class="form-select{% if field.errors %} is-invalid{% endif %}">
      {% for value, label in field.field.choices %}
        <option value="{{ value }}" {% if value|stringformat:'s' == field.value|stringformat:'s' %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  {% else %}
    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
    <input type="{% if field.field.widget.input_type == 'number' %}number{% else %}text{% endif %}"
           {% if field.field.widget.input_type == 'number' %}step="any"{% endif %}
           name="{{ field.html_name }}" id="{{ field.id_for_label }}" value="{{ field.value|default_if_none:'' }}"
           class="form-control{% if field.errors %} is-invalid{% endif %}">
  {% endif %}
  {{ field.errors }}
  {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
</div>
