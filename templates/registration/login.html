{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · FB Group Scraper</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'css/dashboard.css' %}" rel="stylesheet">
</head>
<body>
<div class="login-page">
  <div class="card login-card">
    <div class="card-body p-4 p-md-5">
      <div class="d-flex align-items-center gap-2 mb-4">
        <span class="brand-icon"><i class="bi bi-collection-play"></i></span>
        <div>
          <div class="fw-bold fs-5">Group Scraper</div>
          <div class="text-muted small">Sign in to the dashboard</div>
        </div>
      </div>
      {% if form.errors %}
        <div class="alert alert-danger py-2 small">Your username and password didn't match. Please try again.</div>
      {% endif %}
      <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label" for="id_username">Username</label>
          <input type="text" name="username" id="id_username" class="form-control" autofocus autocomplete="username" required>
        </div>
        <div class="mb-4">
          <label class="form-label" for="id_password">Password</label>
          <input type="password" name="password" id="id_password" class="form-control" autocomplete="current-password" required>
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn btn-primary w-100 py-2" type="submit">Sign in</button>
      </form>
      <p class="text-muted small mt-4 mb-0">
        No account yet? Create one with <code>python manage.py createsuperuser</code>.
      </p>
    </div>
  </div>
</div>
</body>
</html>
